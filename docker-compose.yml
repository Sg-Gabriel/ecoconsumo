
services:
  ecoconsumo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoconsumo
    ports:
      - "8080:8080"
    restart: unless-stopped

    cpus: 0.50
    mem_limit: 128m
    pids_limit: 50

    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
